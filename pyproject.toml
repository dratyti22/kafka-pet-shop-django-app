[project]
name = "django-app"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "celery[amqp]>=5.5.3",
    "django>=5.2.4",
    "django-cors-headers>=4.7.0",
    "django-debug-toolbar>=5.2.0",
    "django-environ>=0.12.0",
    "django-mptt>=0.17.0",
    "django-phonenumber-field>=8.1.0",
    "django-unfold>=0.62.0",
    "djangorestframework>=3.16.0",
    "confluent-kafka>=2.6.1",
    "phonenumberslite>=9.0.9",
    "pillow>=11.3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.10.1",
    "djangorestframework-simplejwt>=5.5.1",
    "ruff>=0.14.1",
    "pytest>=8.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
]
tests = [
    "pytest>=8.4.1",
    "pytest-django>=4.11.1",
]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [
    "*migrations/",
    "*__init__.py",
    "*__pycache__",
    ".git/",
    "env/",
    ".venv/",
    "static/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "R",  # refactor
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]

ignore = [
    "ARG001", # Unused function argument
    "B008",  # do not perform function calls in argument defaults
    "DJ001",  # Avoid using null=True on string-based fields
    "F841", # Local variable is assigned to but never used
    "RET504", # Unnecessary assignment before return statement
    "UP015", # Unnecessary open mode parameters
]

[tool.ruff.lint.isort]
known-third-party = ["django", "rest_framework", "celery"]
known-first-party = ["django_app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_app.test_settings"
python_files = ["conftest.py tests.py test_*.py *_test.py"]
pythonpath ="src"
testpaths ="tests"
addopts = "--tb=short -v"

[tool.pytest.ini_options.markers]
api = "api: testing api endpoints"
user="user: tetings user endpoints"
product="product: tetings product endpoints"
